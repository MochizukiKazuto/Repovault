<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 15px; margin: 0 0 4px; color: #ffffff; }
    p { font-size: 12px; color: #94a3b8; margin: 0 0 12px; line-height: 1.4; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    #btn-scan { background: #4f46e5; color: #fff; }
    #btn-scan:hover { background: #6366f1; }
    #btn-scroll { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    #btn-scroll:hover { background: #334155; }
    #btn-copy { background: #059669; color: #fff; width: 100%; margin-top: 8px; display: none; }
    #btn-copy:hover { background: #10b981; }
    textarea {
      width: 100%;
      height: 120px;
      box-sizing: border-box;
      background: #0f172a;
      color: #67e8f9;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      resize: none;
    }
    .status { font-size: 11px; color: #34d399; margin-bottom: 6px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>RepoVault &bull; Threads Extractor</h1>
  <p>Buka halaman <strong>threads.net/saved</strong>, lalu klik tombol di bawah untuk mengumpulkan link GitHub.</p>
  <div class="row">
    <button id="btn-scroll">Auto-Scroll (5x)</button>
    <button id="btn-scan">Ekstrak Link</button>
  </div>
  <div id="status" class="status"></div>
  <textarea id="output" readonly placeholder="Hasil JSON link GitHub akan muncul di sini..."></textarea>
  <button id="btn-copy">Salin JSON untuk RepoVault</button>
  <script src="popup.js"></script>
</body>
</html>
